[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short --strict-markers
markers =
    gatekeeper: trava jurídica / direitos autorais
    audio: transcrição e eventos sonoros
    vision: análise visual (facecam, movimento)
    scoring: detecção de virais e edit plans
    render: Remotion e QC
